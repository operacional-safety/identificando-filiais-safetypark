        // Função para formatar o status de endereço
        function formatarEndereco(endereco) {
            if (!endereco || endereco.trim() === "") {
                return `<span class="bg-red-100 text-red-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded border border-red-400">Pendente de Atualização</span>`;
            }
            return endereco;
        }

        // Função para popular a tabela e calcular KPIs
        function carregarDados() {
            const tbody = document.getElementById('tabelaCorpo');
            let linhasHTML = '';
            
            let countRJ = 0, countSP = 0, countPendentes = 0;

            unidades.forEach((u, index) => {
                // Cálculo dos KPIs
                if (u.reg === 'RJ') countRJ++;
                if (u.reg === 'SP') countSP++;
                if (!u.end || u.end.trim() === "") countPendentes++;

                // Cor alternada (zebra)
                const bgClass = index % 2 === 0 ? 'bg-spwhite' : 'bg-gray-50';

                linhasHTML += `
                    <tr class="border-b hover:bg-gray-200 transition-colors ${bgClass}">
                        <td class="px-4 py-3 font-medium text-spgray">${u.id} <span class="text-xs bg-spblack text-spwhite px-1 ml-1 rounded">${u.reg}</span></td>
                        <td class="px-4 py-3 font-bold text-spblack">${u.nome}</td>
                        <td class="px-4 py-3">${u.setor}</td>
                        <td class="px-4 py-3 font-medium"><span class="bg-gray-200 px-2 py-1 rounded text-xs text-spblack border border-gray-300">👤 ${u.sup}</span></td>
                        <td class="px-4 py-3 text-xs text-spgray whitespace-normal">${u.func}</td>
                        <td class="px-4 py-3 text-xs whitespace-normal w-1/3 truncate" title="${u.end}">${formatarEndereco(u.end)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = linhasHTML;

            // Atualiza os painéis numéricos superiores
            document.getElementById('kpiTotal').innerText = unidades.length;
            document.getElementById('kpiRJ').innerText = countRJ;
            document.getElementById('kpiSP').innerText = countSP;
            document.getElementById('kpiPendentes').innerText = countPendentes;
        }

        // Função de filtro dinâmico
        function filtrarTabela() {
            const input = document.getElementById('searchInput').value.toUpperCase();
            const tabelaCorpo = document.getElementById('tabelaCorpo');
            const tr = tabelaCorpo.getElementsByTagName('tr');
            let encontrouAlgo = false;

            for (let i = 0; i < tr.length; i++) {
                // Junta o texto de todas as colunas para facilitar a busca
                let textoLinha = tr[i].innerText || tr[i].textContent;
                
                if (textoLinha.toUpperCase().indexOf(input) > -1) {
                    tr[i].style.display = "";
                    encontrouAlgo = true;
                } else {
                    tr[i].style.display = "none";
                }
            }

            // Exibir mensagem se nada for encontrado
            const msgNoResults = document.getElementById('noResults');
            if (encontrouAlgo) {
                msgNoResults.classList.add('hidden');
            } else {
                msgNoResults.classList.remove('hidden');
            }
        }

        // Inicializa ao carregar a página
        window.onload = carregarDados;
